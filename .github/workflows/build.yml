name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name Dark-Souls-Remastered-Switch-to-PC-Converter dsr_switch_to_pc.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Souls-Remastered-Switch-to-PC-Converter-windows
          path: dist/Dark-Souls-Remastered-Switch-to-PC-Converter.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Dark Souls: Remastered - Switch to PC Converter ${{ github.ref_name }}"
          body: |
            Windows GUI/CLI converter for Dark Souls: Remastered Nintendo Switch saves.

            - Converts DRAKS0005.sl2 character data, version stamps and the PC load-screen roster.
            - GUI and command-line modes.
            - Requires a PC DRAKS0005.sl2 as a version-matched template.

            Back up your saves and play offline first.
          files: dist/Dark-Souls-Remastered-Switch-to-PC-Converter.exe
